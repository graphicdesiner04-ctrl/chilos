<body>
  <header class="hero">
    <img class="hero__bg" src="assets/photos/chilos-pizza.webp" alt="" width="800" height="600" fetchpriority="high">
    <div class="hero__in">
      <img class="hero__logo" src="assets/icon.png" alt="شعار تشيلوس" width="96" height="96">
      <h1>تشيلوس</h1>
      <p class="hero__tag">بيتزا · فطير · كريب</p>
      <div class="hero__info">
        <span>📍 مدينة نصر</span>
        <a id="call" href="#">📞 <span id="callNum"></span></a>
      </div>
    </div>
  </header>

  <nav class="bar" aria-label="أقسام المنيو">
    <div class="bar__tabs" id="tabs"></div>
    <button class="bar__search" id="searchBtn" type="button" aria-label="بحث" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
    <div class="bar__q" id="qWrap" hidden>
      <input id="q" type="search" placeholder="دوّر على صنف... (مثال: رانش)" autocomplete="off" aria-label="بحث في المنيو">
    </div>
  </nav>

  <main class="list" id="list"></main>
  <p class="nores" id="nores" hidden></p>

  <footer class="foot">
    <img src="assets/icon-96.png" alt="" width="56" height="56" loading="lazy">
    <p id="addr"></p>
    <p class="foot__ph"><a id="call2" href="#"></a> · <a id="land" href="#"></a></p>
    <p class="foot__wa">واتساب: <a id="wa" href="#" target="_blank" rel="noopener"></a></p>
    <small>الأسعار بالجنيه المصري<span id="aiNote"> · الصور توضيحية</span></small>
  </footer>

  <script src="menu.js?v=9"></script>
  <script src="emenu.js?v=1"></script>
